name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements-validation.lock
          pip install --no-build-isolation --no-deps -e .
      - name: Lint and test
        run: |
          ruff check src tests
          pytest tests -q
      - name: Validate publication provenance
        run: python tools/validate_publication.py --require-git
      - name: Validate portfolio project
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker
      - name: Build pinned image
        run: docker build -t alpr-mercosul:ci .
      - name: Run OCR benchmark offline
        run: docker run --rm --network none alpr-mercosul:ci benchmark --n-plates 100 --seed 42 --output /tmp/baseline.json
