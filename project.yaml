id: 5
name: alpr-mercosul
program:
  id: applied-computer-vision
  narrative_fit: Proves Mercosul license plate OCR with deterministic synthetic data and an oracle reader, establishing a reproducible baseline for character-level and plate-level accuracy.
  shared_assets:
    - reproducible benchmark JSON schema (plate-level)
    - synthetic plate image fixture generator
status: published
claim: leitura de placa Mercosul
stack:
  - python
  - opencv
  - ultralytics
  - paddleocr
  - docker
language_profile:
  primary: python-ml
  secondary: []
  reason: Python with Pillow handles synthetic image generation; numpy supports array operations; the oracle OCR avoids heavy GPU dependency for the reproducible baseline.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: applied-computer-vision
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: recorded
  principles:
    coupling_rule: domain types depend only on standard library; fixture depends only on Pillow; OCR depends on domain types; CLI depends on all three inward.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: one synthetic plate fixture, one oracle OCR, one JSON benchmark output prove the claim without external data or GPU infrastructure.
    testability_rule: domain and oracle OCR run with synthetic data; no network, database, or cloud dependency required.
    rejected_overengineering:
      - deep learning OCR pipeline
      - real license plate image dataset
      - GPU training
      - model serving API
  stack_profile: python-ml
  api_style: cli
  messaging: none
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: no cloud dependency; all data is synthetic and local
    config_switch: none
    unsupported_behaviors: []
  database: none
  runtime: Python CLI in a slim Docker image; oracle OCR with deterministic seed.
  library_policy: Pillow for synthetic image generation; argparse for CLI; no other runtime dependencies for the baseline path.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: PaddleOCR/Ultralytics real OCR pipeline
      reason: Heavy GPU dependency and installation complexity; oracle OCR establishes the deterministic baseline first; real OCR can be added as a real-backend option later.
    - option: Real license plate dataset
      reason: External datasets introduce reproducibility risk and network dependency; synthetic fixtures are deterministic and local.
architecture:
  style: pipeline
  reason: Image generation, OCR reading, and benchmark evaluation form a natural three-stage pipeline from synthetic input to benchmark output.
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: medium
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: fixture depends only on Pillow; OCR depends on domain types; benchmark depends on fixture and OCR; CLI depends on all three.
  boundaries:
    - fixture owns synthetic plate image generation with deterministic seed
    - ocr owns plate reading and character comparison
    - benchmark owns orchestration and JSON output
    - cli owns command-line interface
  rejected_alternatives:
    - style: hexagonal
      reason: There is no infrastructure or transport boundary to justify ports and adapters; a three-stage pipeline is sufficient.
    - style: microservices
      reason: A single-machine OCR pipeline has no deployment boundary worth splitting.
benchmark:
  primary_metric: character_accuracy
  unit: unit
  command: "alpr-mercosul benchmark --n-plates 100 --seed 42 --output benchmarks/results/baseline.json"
  result_path: benchmarks/results/baseline.json
release:
  docker: "docker run --rm alpr-mercosul"
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
