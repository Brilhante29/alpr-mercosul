id: 5
name: alpr-mercosul
program:
  id: applied-computer-vision
  narrative_fit: Proves deterministic Mercosul-format plate OCR from synthetic image pixels with template matching, character accuracy, and explicit real-road limitations.
  shared_assets:
    - reproducible benchmark JSON schema (plate-level)
    - synthetic plate image fixture generator
status: benchmarked
claim: synthetic Mercosul plate OCR from image pixels
stack:
  - python-3.12
  - pillow-10.4.0
  - numpy-1.26.4
  - pytest
  - docker
language_profile:
  primary: python
  secondary: []
  reason: Python, Pillow, and NumPy implement deterministic rendering and image-only template matching without model downloads, GPU, or network access.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: applied-computer-vision
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: recorded
  principles:
    coupling_rule: domain types depend only on the standard library; rendering owns glyph geometry; OCR receives image pixels only; benchmark alone owns ground-truth evaluation.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: one fixed-layout fixture, one image-only template matcher, and one JSON evidence path prove the narrow synthetic claim without external data or GPU infrastructure.
    testability_rule: a pixel-mutation test proves prediction follows image content rather than labels; no network, database, or cloud dependency is required.
    rejected_overengineering:
      - deep learning OCR pipeline
      - real license plate image dataset
      - GPU training
      - model serving API
  stack_profile: python-ml
  api_style: cli
  messaging: none
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: no cloud dependency; all data is synthetic and local
    config_switch: none
    unsupported_behaviors: []
  database: none
  runtime: Python CLI in a slim Docker image; deterministic template-matching OCR with seed 42.
  library_policy: Pin Pillow and NumPy for rendering and binary template distance; use argparse for CLI; add no model, HTTP, broker, or cloud runtime.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: PaddleOCR/Ultralytics model pipeline
      reason: Model downloads, GPU cost, and external artifact provenance are not justified before a truthful image-only local baseline; real-road OCR remains a separate workload.
    - option: Real license plate dataset
      reason: External datasets introduce reproducibility risk and network dependency; synthetic fixtures are deterministic and local.
architecture:
  style: pipeline
  reason: Rendering, image-only prediction, and ground-truth evaluation form a directional pipeline whose function signatures prevent label leakage.
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: medium
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: domain is framework-free; rendering is shared by fixture and matcher; OCR accepts pixels only; benchmark owns labels and evaluation; CLI composes inward.
  boundaries:
    - fixture owns synthetic plate image generation with deterministic seed
    - ocr owns image-only prediction; benchmark owns label comparison
    - benchmark owns orchestration and JSON output
    - cli owns command-line interface
  rejected_alternatives:
    - style: hexagonal
      reason: There is no infrastructure or transport boundary to justify ports and adapters; a three-stage pipeline is sufficient.
    - style: microservices
      reason: A single-machine OCR pipeline has no deployment boundary worth splitting.
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
benchmark:
  primary_metric: character_accuracy
  unit: unit
  command: "alpr-mercosul benchmark --n-plates 100 --seed 42 --output benchmarks/results/baseline.json"
  result_path: benchmarks/results/baseline.json
  publication_result_path: benchmarks/publication/alpr-baseline-v2.json
  evidence_status: current
release:
  docker: "docker run --rm alpr-mercosul"
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
