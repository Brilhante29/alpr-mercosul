[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpr-mercosul"
version = "0.1.0"
description = "Mercosul license plate OCR benchmark"
requires-python = ">=3.10"
dependencies = [
    "pillow==10.4.0",
    "numpy==1.26.4",
]
optional-dependencies = { dev = ["pytest==8.3.4", "ruff==0.9.7"] }

[project.scripts]
alpr-mercosul = "alpr_mercosul.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
